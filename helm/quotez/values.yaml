global:
  # REST API / backoffice of the QOTD service, shared by the website.
  # Credentials go into a Secret; pass them at install time, e.g.
  #   --set global.api.username=... --set global.api.password=...
  api:
    enabled: true
    username: ""
    password: ""

qotd-service:
  enabled: true
  image:
    repository: ghcr.io/f-pd/quotez
    tag: latest
  service:
    tcpPort: 8017
    udpPort: 8017
    httpPort: 8080
  persistence:
    size: 1Gi
    storageClass: ""

qotd-web:
  enabled: true
  image:
    repository: ghcr.io/f-pd/quotez-web
    tag: latest
