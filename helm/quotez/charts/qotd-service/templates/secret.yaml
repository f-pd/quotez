{{- if .Values.global.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-quotez-api
  labels:
    {{- include "qotd-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "set global.api.username" .Values.global.api.username | quote }}
  password: {{ required "set global.api.password" .Values.global.api.password | quote }}
{{- end }}
