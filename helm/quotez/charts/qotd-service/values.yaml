enabled: true

replicaCount: 1

image:
  repository: ghcr.io/f-pd/quotez
  tag: latest
  pullPolicy: Always

# Service ports; the container always listens on 8017 (QOTD) and 8080 (HTTP).
service:
  type: ClusterIP
  tcpPort: 8017
  udpPort: 8017
  httpPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

persistence:
  size: 1Gi
  storageClass: ""

global:
  api:
    enabled: false
    username: ""
    password: ""
