[server]
host = "0.0.0.0"
tcp_port = 8017
udp_port = 8017

[quotes]
# seed-quotes ships with the repo so the service never starts empty;
# /data/quotes is the persistent volume for API-managed quotes.
directories = ["/data/seed-quotes", "/data/quotes"]
mode = "random"

[polling]
interval_seconds = 60

[health]
enabled = true
port = 8080

[api]
enabled = true
# Credentials are NOT stored here. They are injected at runtime via
# QOTD_API_USERNAME / QOTD_API_PASSWORD (or the *_FILE variants for secret
# files). In Dokploy set them in the Compose service "Environment" tab.
quotes_path = "/data/quotes/api-managed.json"
