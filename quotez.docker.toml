[server]
host = "0.0.0.0"
tcp_port = 8017
udp_port = 8017

[quotes]
directories = ["/data/seed-quotes", "/data/quotes"]
mode = "random"

[polling]
interval_seconds = 60

[health]
enabled = false
port = 8080

[api]
enabled = false
username = "quotez-admin"
password = "change-me-in-production"

[locales]
# Quote languages (BCP 47). Pages and QOTD requests in other languages get 404 / an info line.
supported = ["en", "it", "fr"]
# Language assumed for quotes that do not declare one
default = "en"
