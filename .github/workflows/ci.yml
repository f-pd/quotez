name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Zig 0.17.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build --summary all

      - name: Test (unit, integration, e2e, perf, reload)
        run: zig build test-all --summary all

  image:
    name: Publish image to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: website
          file: website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Optional: redeploy production only once the new images are on GHCR.
      # Set the repo secret DOKPLOY_DEPLOY_WEBHOOK to the compose service's
      # deploy webhook URL (Deployments tab; its token only redeploys this
      # service). In Dokploy keep Autodeploy ON but set Trigger Type to "Tag",
      # so plain pushes no longer deploy before the image exists. The endpoint
      # expects a GitHub push payload for the configured branch.
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        if: env.DOKPLOY_DEPLOY_WEBHOOK != ''
        run: |
          payload=$(jq -n --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg msg "$COMMIT_MSG" \
            '{ref: $ref, after: $sha, head_commit: {id: $sha, message: $msg}, commits: []}')
          curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data "$payload"
