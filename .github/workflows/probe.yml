name: probe
on:
  push:
    branches: [ops/probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for H in quotez.fulgid.us qotd.fulgid.us quotes.fulgid.us quote.fulgid.us fulgid.us www.fulgid.us; do
            echo "== $H $(dig +short $H | tr '\n' ' ')"
            for u in / /quote /admin; do echo "  $u $(curl -s -m8 -o /tmp/b -w '%{http_code}' https://$H$u) $(head -c 120 /tmp/b | tr -d '\n')"; done
          done
