services:
  quotes-init:
    image: busybox:latest
    command: ["sh", "-c", "mkdir -p /data/quotes && chown -R 65532:65532 /data/quotes"]
    volumes:
      - quotes:/data/quotes
    restart: "no"

  qotd-service:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    depends_on:
      quotes-init:
        condition: service_completed_successfully
    ports:
      - "8017:8017/tcp"
      - "8017:8017/udp"
      - "127.0.0.1:8080:8080"
      # RFC 865 standard port: Docker binds host port 17, the container
      # keeps listening on unprivileged 8017 as the nonroot user.
      - "17:8017/tcp"
      - "17:8017/udp"
    volumes:
      - ./quotez.prod.toml:/quotez.toml:ro
      - ./quotes:/data/seed-quotes:ro
      - quotes:/data/quotes

volumes:
  quotes:
