services:
  qotd-service:
    # Built and published by CI (.github/workflows/ci.yml); the deploy only
    # pulls it. Pin a commit tag (ghcr.io/f-pd/quotez:sha-<short>) to roll back.
    image: ghcr.io/f-pd/quotez:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8017:8017/tcp"
      - "8017:8017/udp"
      - "127.0.0.1:8080:8080"
      # RFC 865 standard port: Docker binds host port 17, the container
      # keeps listening on unprivileged 8017 as the nonroot user.
      - "17:8017/tcp"
      - "17:8017/udp"
    environment:
      # Provided by Dokploy's Environment tab (written to .env next to this file).
      # Deploy fails fast if they are missing instead of starting with no auth.
      QOTD_API_USERNAME: ${QOTD_API_USERNAME:?set QOTD_API_USERNAME in Dokploy Environment}
      QOTD_API_PASSWORD: ${QOTD_API_PASSWORD:?set QOTD_API_PASSWORD in Dokploy Environment}
    volumes:
      - ./quotez.prod.toml:/quotez.toml:ro
      - quotes:/data/quotes

  # Backoffice (/admin) and public site; also proxies the public read-only
  # routes (/help, /quote, /n/:num, /tags). Not published on the host: point
  # the Dokploy domain at this service, port 3000.
  web:
    image: ghcr.io/f-pd/quotez-web:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - qotd-service
    environment:
      QOTD_API_HOST: qotd-service
      QOTD_API_PORT: "8080"
      QOTD_TCP_HOST: qotd-service
      QOTD_TCP_PORT: "8017"
      QOTD_API_USERNAME: ${QOTD_API_USERNAME:?set QOTD_API_USERNAME in Dokploy Environment}
      QOTD_API_PASSWORD: ${QOTD_API_PASSWORD:?set QOTD_API_PASSWORD in Dokploy Environment}
    volumes:
      - web-data:/data

volumes:
  quotes:
  web-data:
